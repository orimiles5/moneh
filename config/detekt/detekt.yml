# Overrides on top of detekt's default config.
style:
  MagicNumber:
    # Calendar code transcribes published algorithms; named constants would obscure them.
    excludes: ['**/commonTest/**', '**/jvmTest/**', '**/calendar/**']
  MaxLineLength:
    maxLineLength: 140 # match ktlint_official
complexity:
  TooManyFunctions:
    ignorePrivate: true # count the API surface, not private helpers
