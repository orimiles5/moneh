name: Moneh
options:
  developmentLanguage: he
  deploymentTarget:
    iOS: "18.0"
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Moneh:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: ../design/fonts
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        UIAppFonts: [Heebo-Regular.ttf, Heebo-Medium.ttf, Heebo-Bold.ttf, Heebo-Black.ttf]
        UIBackgroundModes: [location]
        NSSupportsLiveActivities: true
        # Localized in App/InfoPlist.xcstrings.
        NSLocationWhenInUseUsageDescription: מונה משתמש במיקום כדי למדוד את מרחק הנסיעה בזמן שהמונה פועל. המיקום נשאר במכשיר.
        NSFaceIDUsageDescription: מונה מזהה את הנהג בפתיחת משמרת.
    dependencies:
      # Built by ./gradlew :core:assembleMonehCoreReleaseXCFramework
      - framework: ../core/build/XCFrameworks/release/MonehCore.xcframework
        embed: false
      - target: MonehLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(CARPLAY_CONDITION_$(CARPLAY_ENABLED))
        CODE_SIGN_ENTITLEMENTS: $(CARPLAY_ENTITLEMENTS_$(CARPLAY_ENABLED))
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1"
  MonehLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiveActivity
      - Shared
      - App/Localizable.xcstrings
      - path: ../design/fonts
        buildPhase: resources
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        UIAppFonts: [Heebo-Regular.ttf, Heebo-Medium.ttf, Heebo-Bold.ttf, Heebo-Black.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).LiveActivity
        TARGETED_DEVICE_FAMILY: "1"
  MonehTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Moneh
      - package: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.5
schemes:
  Moneh:
    build:
      targets:
        Moneh: all
    test:
      targets: [MonehTests]
